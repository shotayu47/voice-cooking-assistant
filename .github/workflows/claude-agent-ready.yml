name: Claude Agent Ready

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open agent-ready issue number to implement
        required: true
        type: string

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' &&
       github.event.issue.state == 'open' &&
       github.event.label.name == 'agent-ready') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Resolve issue context
        id: issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            issue_number="$INPUT_ISSUE_NUMBER"
          else
            issue_number="$EVENT_ISSUE_NUMBER"
          fi

          if ! [[ "$issue_number" =~ ^[0-9]+$ ]]; then
            echo "Invalid issue number." >&2
            exit 1
          fi

          issue_json="$(gh issue view "$issue_number" --json number,title,body,state,labels,url)"
          state="$(jq -r '.state' <<<"$issue_json")"
          has_agent_ready="$(jq -r '[.labels[].name] | index("agent-ready") != null' <<<"$issue_json")"

          if [ "$state" != "OPEN" ] || [ "$has_agent_ready" != "true" ]; then
            echo "Issue #${issue_number} is not an open agent-ready issue." >&2
            exit 1
          fi

          title="$(jq -r '.title' <<<"$issue_json")"
          body="$(jq -r '.body // ""' <<<"$issue_json")"

          echo "number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          {
            echo "prompt<<__AGENT_PROMPT__"
            echo "Implement GitHub issue #${issue_number} exactly as specified."
            echo
            echo "Issue title: ${title}"
            echo
            echo "Issue body:"
            echo "$body"
            echo "__AGENT_PROMPT__"
          } >> "$GITHUB_OUTPUT"

      - name: Normalize OAuth secret safely
        id: oauth
        shell: bash
        env:
          CLAUDE_TOKEN_RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python - <<'PY'
          import os

          raw = os.environ.get("CLAUDE_TOKEN_RAW", "")
          token = raw.strip()

          if not token:
              category = "EMPTY"
          elif any(ch.isspace() for ch in token):
              category = "INTERNAL_WHITESPACE"
          elif token.startswith("sk-ant-oat"):
              category = "EXPECTED_OAUTH_PREFIX"
          else:
              category = "OTHER_PREFIX"

          print(f"CLAUDE_OAUTH_PREFLIGHT={category}")

          if token:
              print(f"::add-mask::{token}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"token={token}\n")
          PY

      - name: Run Claude Code from label event
        id: claude_event
        if: github.event_name == 'issues'
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ steps.oauth.outputs.token }}
          label_trigger: agent-ready
          claude_args: |
            --max-turns 20
            --allowedTools "Edit,Write"
            --system-prompt "Before modifying code, read AGENTS.md, CLAUDE.md, and docs/implementation-roadmap.md. Treat the labeled issue body as the complete task specification. Make only the requested changes, then commit and push the branch. Deterministic repository quality gates are owned by the GitHub Actions CI job that runs after the pull request is created; do not spend agent turns running npm quality-gate commands yourself, and report those checks as pending CI rather than claiming they passed. Do not modify or reveal secrets. Do not modify GitHub workflow files. Do not merge branches. Never claim a migration, deployment, or manual verification succeeded unless it was actually verified. If a task requires an external or manual step, report it clearly instead of guessing."

      - name: Run Claude Code from autonomous dispatch
        id: claude_dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ steps.oauth.outputs.token }}
          prompt: ${{ steps.issue.outputs.prompt }}
          claude_args: |
            --max-turns 20
            --allowedTools "Edit,Write"
            --system-prompt "Before modifying code, read AGENTS.md, CLAUDE.md, and docs/implementation-roadmap.md. Treat the supplied GitHub issue body as the complete task specification. Make only the requested changes, then commit and push the branch. Deterministic repository quality gates are owned by the GitHub Actions CI job that runs after the pull request is created; do not spend agent turns running npm quality-gate commands yourself, and report those checks as pending CI rather than claiming they passed. Do not modify or reveal secrets. Do not modify GitHub workflow files. Do not merge branches. Never claim a migration, deployment, or manual verification succeeded unless it was actually verified. If a task requires an external or manual step, report it clearly instead of guessing."

      - name: Normalize Claude branch output
        id: claude
        if: always()
        shell: bash
        env:
          EVENT_BRANCH: ${{ steps.claude_event.outputs.branch_name }}
          DISPATCH_BRANCH: ${{ steps.claude_dispatch.outputs.branch_name }}
          EVENT_OUTCOME: ${{ steps.claude_event.outcome }}
          DISPATCH_OUTCOME: ${{ steps.claude_dispatch.outcome }}
        run: |
          set -euo pipefail

          branch="${EVENT_BRANCH:-${DISPATCH_BRANCH:-}}"
          echo "branch_name=$branch" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_OUTCOME" = "failure" ] || [ "$DISPATCH_OUTCOME" = "failure" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request when Claude pushed changes
        id: pr
        if: steps.claude.outputs.branch_name != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.claude.outputs.branch_name }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --heads origin "refs/heads/${BRANCH_NAME}" >/dev/null 2>&1; then
            echo "Claude did not push a remote branch; no PR to create."
            exit 0
          fi

          git fetch --no-tags origin \
            "main:refs/remotes/origin/main" \
            "${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}"

          if git diff --quiet "origin/main...origin/${BRANCH_NAME}"; then
            echo "Claude branch has no changes relative to main; no PR to create."
            exit 0
          fi

          existing_pr="$(gh pr list --state open --base main --head "${BRANCH_NAME}" --json number --jq '.[0].number // empty')"
          if [ -n "${existing_pr}" ]; then
            echo "Pull request #${existing_pr} already exists."
            echo "number=${existing_pr}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          cat > /tmp/agent-pr-body.md <<EOF
          Automated implementation for #${ISSUE_NUMBER}.

          This pull request was created automatically after Claude Code pushed changes from an \`agent-ready\` issue.

          - Source issue: #${ISSUE_NUMBER}
          - Human merge remains required.
          - CI is dispatched explicitly after PR creation.
          EOF

          pr_url="$(gh pr create \
            --base main \
            --head "${BRANCH_NAME}" \
            --title "${ISSUE_TITLE}" \
            --body-file /tmp/agent-pr-body.md)"

          pr_number="$(gh pr view "${pr_url}" --json number --jq '.number')"
          echo "Created pull request #${pr_number}: ${pr_url}"
          echo "number=${pr_number}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch CI for the Claude branch
        if: steps.pr.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.claude.outputs.branch_name }}
        run: |
          gh workflow run ci.yml --ref "${BRANCH_NAME}"
          echo "Dispatched CI for ${BRANCH_NAME}."

      - name: Classify Claude failure safely
        if: always() && steps.claude.outputs.failed == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("/home/runner/work/_temp/claude-execution-output.json")
          if not path.exists():
              print("CLAUDE_FAILURE_CATEGORY=NO_OUTPUT_FILE")
              raise SystemExit(0)

          text = path.read_text(errors="replace").lower()

          if any(s in text for s in ["error_max_turns", "reached maximum number of turns", "maximum number of turns", "exceeding the configured maximum"]):
              category = "MAX_TURNS"
          elif any(s in text for s in ["usage limit", "rate limit", "rate_limit", "quota", "too many requests", "status code 429", "api error: 429"]):
              category = "USAGE_OR_RATE_LIMIT"
          elif any(s in text for s in ["invalid bearer", "could not resolve authentication", "authentication credentials", "unauthorized", "status code 401", "api error: 401"]):
              category = "AUTHENTICATION"
          elif "model" in text and any(s in text for s in ["not found", "unavailable", "not available", "access", "unsupported"]):
              category = "MODEL_ACCESS"
          elif "permission" in text or "requires approval" in text:
              category = "TOOL_PERMISSION"
          else:
              category = "UNKNOWN"

          print(f"CLAUDE_FAILURE_CATEGORY={category}")
          PY
