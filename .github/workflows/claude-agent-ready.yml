name: Claude Agent Ready

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open agent-ready issue number to implement
        required: true
        type: string

concurrency:
  group: claude-agent-ready-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' &&
       github.event.issue.state == 'open' &&
       github.event.label.name == 'agent-ready') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve issue context
        id: issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            issue_number="$INPUT_ISSUE_NUMBER"
          else
            issue_number="$EVENT_ISSUE_NUMBER"
          fi

          if ! [[ "$issue_number" =~ ^[0-9]+$ ]]; then
            echo "Invalid issue number." >&2
            exit 1
          fi

          issue_json="$(gh issue view "$issue_number" --json number,title,body,state,labels,url)"
          state="$(jq -r '.state' <<<"$issue_json")"
          has_agent_ready="$(jq -r '[.labels[].name] | index("agent-ready") != null' <<<"$issue_json")"

          if [ "$state" != "OPEN" ] || [ "$has_agent_ready" != "true" ]; then
            echo "Issue #${issue_number} is not an open agent-ready issue." >&2
            exit 1
          fi

          title="$(jq -r '.title' <<<"$issue_json")"
          body="$(jq -r '.body // ""' <<<"$issue_json")"
          branch="claude/issue-${issue_number}"

          echo "number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          {
            echo "# GitHub issue #${issue_number}"
            echo
            echo "Title: ${title}"
            echo
            echo "$body"
          } > /tmp/agent-issue.md

      - name: Ensure clean implementation branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.issue.outputs.branch }}
        run: |
          set -euo pipefail

          existing_pr="$(gh pr list --state open --base main --head "$BRANCH_NAME" --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "An open implementation PR already exists: #${existing_pr}."
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH_NAME}" >/dev/null 2>&1; then
            echo "Remote branch ${BRANCH_NAME} already exists without an open PR; refusing to overwrite it."
            exit 1
          fi

          git switch -c "$BRANCH_NAME" origin/main

      - name: Normalize OAuth secret safely
        id: oauth
        shell: bash
        env:
          CLAUDE_TOKEN_RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          token = os.environ.get("CLAUDE_TOKEN_RAW", "").strip()
          if not token:
              raise SystemExit("CLAUDE_CODE_OAUTH_TOKEN is empty")
          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"token={token}\n")
          PY

      - name: Install pinned Claude Code CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.237
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: Implement issue with direct Claude CLI
        id: implement
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.oauth.outputs.token }}
          DISABLE_AUTOUPDATER: "1"
        run: |
          set -uo pipefail

          cat > /tmp/implementation-prompt.md <<'PROMPT'
          You are the implementation agent in a bounded autonomous development pipeline.

          Read these first:
          - /tmp/agent-issue.md
          - AGENTS.md
          - CLAUDE.md
          - docs/implementation-roadmap.md

          Then inspect only the repository files needed to implement the issue correctly.

          Requirements:
          - Implement exactly the supplied issue and no later PHASE.
          - You may read, search, edit, and create repository files.
          - Do not run shell commands, git commands, npm commands, tests, builds, network calls, or GitHub operations.
          - GitHub Actions owns validation, commit, push, PR creation, CI, and review after you finish editing.
          - Do not modify .github/workflows, AGENTS.md, CLAUDE.md, .claude, auth, middleware, RLS/policies, migrations, secrets, environment files, destructive data operations, or production infrastructure.
          - If the requested implementation unexpectedly requires a protected/high-risk change, make no protected change and explain the blocker in your final result.
          - Add or update deterministic tests required by the issue, but do not execute them.
          - Never claim tests, deployment, migration, production behavior, or manual QA passed unless that was actually verified externally.
          - Keep the implementation minimal and consistent with existing architecture.

          Finish by returning a concise summary of what you changed and any manual QA still required.
          PROMPT

          set +e
          "$HOME/.local/bin/claude" -p "$(cat /tmp/implementation-prompt.md)" \
            --output-format json \
            --no-session-persistence \
            --max-turns 32 \
            --tools "Read,Glob,Grep,Edit,Write" \
            --disallowedTools "Bash,WebSearch,WebFetch,mcp__*" \
            --permission-mode dontAsk \
            > /tmp/implementation-result.json \
            2> /tmp/implementation-stderr.log
          exit_code=$?
          set -e

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Validate implementation result and changed paths
        id: validate
        shell: bash
        env:
          EXIT_CODE: ${{ steps.implement.outputs.exit_code }}
        run: |
          set -euo pipefail

          if [ "${EXIT_CODE:-1}" != "0" ]; then
            category="CLI_FAILURE"
            combined="$(cat /tmp/implementation-result.json /tmp/implementation-stderr.log 2>/dev/null || true)"
            if grep -Eiq 'authentication|invalid bearer|unauthorized|status code 401|api error: 401' <<<"$combined"; then
              category="AUTHENTICATION"
            elif grep -Eiq 'usage limit|rate limit|rate_limit|quota|too many requests|status code 429|api error: 429' <<<"$combined"; then
              category="USAGE_OR_RATE_LIMIT"
            elif grep -Eiq 'max[_ -]?turn|maximum number of turns|error_max_turns' <<<"$combined"; then
              category="MAX_TURNS"
            fi
            echo "IMPLEMENTATION_FAILURE_CATEGORY=$category"
            exit 1
          fi

          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Claude completed without repository changes."
            exit 1
          fi

          changed_files="$(git status --porcelain=v1 | sed -E 's/^.. //' | sed -E 's/.* -> //' )"
          protected_re='(^|/)(AGENTS\.md|CLAUDE\.md|\.mcp\.json)$|^\.github/workflows/|^\.claude/|^supabase/migrations/|(^|/)(auth|middleware)(/|\.|$)|(^|/)(rls|polic(y|ies))(/|\.|$)|(^|/)\.env|(^|/)vercel\.json$'

          if grep -Eiq "$protected_re" <<<"$changed_files"; then
            echo "Claude attempted to modify a protected/high-risk path."
            git status --short
            exit 1
          fi

          if grep -Eiq '(^|/)(\.env($|\.)|.*secret.*|.*credential.*)' <<<"$changed_files"; then
            echo "Potential secret-bearing path detected."
            exit 1
          fi

          echo "Changed files:"
          printf '%s\n' "$changed_files"

      - name: Commit and push implementation
        id: push
        shell: bash
        env:
          BRANCH_NAME: ${{ steps.issue.outputs.branch }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No staged implementation changes."
            exit 1
          fi

          git commit -m "feat: implement issue #${ISSUE_NUMBER}" \
            -m "${ISSUE_TITLE}"
          git push origin "HEAD:${BRANCH_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.issue.outputs.branch }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
        run: |
          set -euo pipefail

          cat > /tmp/agent-pr-body.md <<EOF
          Automated implementation for #${ISSUE_NUMBER}.

          - Source issue: #${ISSUE_NUMBER}
          - Implementation used the bounded direct Claude Code CLI path.
          - GitHub Actions owns deterministic CI and independent review.
          - Human merge remains required.
          EOF

          pr_url="$(gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "$ISSUE_TITLE" \
            --body-file /tmp/agent-pr-body.md)"
          pr_number="$(gh pr view "$pr_url" --json number --jq '.number')"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Dispatch CI for implementation branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.issue.outputs.branch }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$BRANCH_NAME"

      - name: Mark issue implementation started
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Direct CLI implementation completed and a PR was created: ${PR_URL}. CI and independent review continue automatically; no merge was attempted."
