name: Claude Review Fix

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to repair
        required: true
        type: string
      review_attempt:
        description: Review attempt that produced the blocking findings
        required: true
        type: string
      reviewed_sha:
        description: Exact PR head SHA that was reviewed
        required: true
        type: string
      review_json:
        description: Validated independent-review JSON
        required: true
        type: string

concurrency:
  group: claude-review-fix-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Validate PR and reviewed SHA
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_ATTEMPT: ${{ inputs.review_attempt }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          set -euo pipefail

          echo "eligible=false" >> "$GITHUB_OUTPUT"

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number."
            exit 1
          fi

          if ! [[ "$REVIEW_ATTEMPT" =~ ^[12]$ ]]; then
            echo "Fix dispatch is allowed only after review attempt 1 or 2."
            exit 1
          fi

          pr_json="$(gh pr view "$PR_NUMBER" \
            --json state,baseRefName,headRefName,headRefOid,isCrossRepository,body)"

          state="$(jq -r '.state' <<<"$pr_json")"
          base="$(jq -r '.baseRefName' <<<"$pr_json")"
          branch="$(jq -r '.headRefName' <<<"$pr_json")"
          current_sha="$(jq -r '.headRefOid' <<<"$pr_json")"
          cross_repo="$(jq -r '.isCrossRepository' <<<"$pr_json")"

          if [ "$state" != "OPEN" ] || [ "$base" != "main" ] || [ "$cross_repo" != "false" ]; then
            echo "PR is not an eligible same-repository open PR against main."
            exit 0
          fi

          if [[ "$branch" != claude/* ]]; then
            echo "Only claude/* branches are eligible for automated repair."
            exit 0
          fi

          if [ "$current_sha" != "$REVIEWED_SHA" ]; then
            echo "PR head changed after review; stale repair request ignored."
            exit 0
          fi

          source_issue="$(sed -nE 's/.*Source issue: #([0-9]+).*/\1/p' <<<"$(jq -r '.body // ""' <<<"$pr_json")" | head -n1)"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "source_issue=$source_issue" >> "$GITHUB_OUTPUT"
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        if: steps.meta.outputs.eligible == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.meta.outputs.branch }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Prepare fix context and commit guard
        if: steps.meta.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_ISSUE: ${{ steps.meta.outputs.source_issue }}
          REVIEW_JSON: ${{ inputs.review_json }}
        run: |
          set -euo pipefail

          jq -ce . <<<"$REVIEW_JSON" > .agent-fix-context.json

          {
            echo "# Generated source issue context"
            if [ -n "$SOURCE_ISSUE" ]; then
              gh issue view "$SOURCE_ISSUE" --json number,title,body,url
            else
              echo "No source issue could be resolved from the PR body."
              gh pr view "$PR_NUMBER" --json number,title,body,url
            fi
          } > .agent-source-issue.md

          cat > .git/hooks/pre-commit <<'HOOK'
          #!/usr/bin/env bash
          set -euo pipefail
          protected_re='(^|/)(AGENTS\.md|CLAUDE\.md|\.mcp\.json)$|^\.github/workflows/|^\.claude/|^supabase/migrations/|(^|/)(auth|middleware)(/|\.|$)|(^|/)(rls|polic(y|ies))(/|\.|$)|(^|/)\.env|(^|/)vercel\.json$|^\.agent-'
          staged="$(git diff --cached --name-only)"
          if grep -Eiq "$protected_re" <<<"$staged"; then
            echo "Protected/high-risk path detected. Automated fixer may not commit this change." >&2
            exit 1
          fi
          HOOK
          chmod +x .git/hooks/pre-commit

      - name: Normalize OAuth secret safely
        if: steps.meta.outputs.eligible == 'true'
        id: oauth
        shell: bash
        env:
          CLAUDE_TOKEN_RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          token = os.environ.get("CLAUDE_TOKEN_RAW", "").strip()
          if not token:
              raise SystemExit("CLAUDE_CODE_OAUTH_TOKEN is empty")
          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"token={token}\n")
          PY

      - name: Install pinned Claude Code CLI
        if: steps.meta.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.236
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: Repair blocking findings with Claude
        if: steps.meta.outputs.eligible == 'true'
        id: fixer
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.oauth.outputs.token }}
          DISABLE_AUTOUPDATER: "1"
        run: |
          set -uo pipefail

          cat > /tmp/fixer-prompt.md <<'PROMPT'
          Repair only the blocking findings in `.agent-fix-context.json` for the pull request
          branch already checked out.

          Read first:
          - .agent-fix-context.json
          - .agent-source-issue.md
          - AGENTS.md
          - CLAUDE.md
          - docs/implementation-roadmap.md

          Then inspect the relevant source files. Address only `blocking_issues`.
          Non-blocking notes are optional and must not expand scope.

          Do not modify:
          - `.agent-fix-context.json` or `.agent-source-issue.md`
          - GitHub workflow files
          - AGENTS.md or CLAUDE.md
          - auth, middleware, RLS/policy files, migrations, secrets, or production infrastructure

          Do not run npm/npx quality gates. GitHub Actions CI owns deterministic verification.
          Do not commit, push, merge, or perform any git operation. The workflow will inspect,
          commit, and push the resulting file edits only after enforcing its safety rules.

          Make the smallest correct edit that resolves the blocking findings. If the findings
          cannot be fixed safely under these constraints, leave the repository unchanged.
          PROMPT

          set +e
          "$HOME/.local/bin/claude" -p "$(cat /tmp/fixer-prompt.md)" \
            --safe-mode \
            --output-format json \
            --no-session-persistence \
            --max-turns 20 \
            --tools "Read,Glob,Grep,Edit,Write" \
            --allowedTools "Edit,Write" \
            --disallowedTools "mcp__*" \
            --permission-mode dontAsk \
            > /tmp/fixer-result.json \
            2> /tmp/fixer-stderr.log
          exit_code=$?
          set -e

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Validate, commit, push, and dispatch CI
        if: steps.meta.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH_NAME: ${{ steps.meta.outputs.branch }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          REVIEW_ATTEMPT: ${{ inputs.review_attempt }}
          FIXER_EXIT_CODE: ${{ steps.fixer.outputs.exit_code }}
        run: |
          set -euo pipefail

          rm -f .agent-fix-context.json .agent-source-issue.md

          changed_files="$({
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sed '/^$/d' | sort -u)"

          if [ -z "$changed_files" ]; then
            gh label create human-required \
              --color D93F0B \
              --description "Automated review/fix stopped; human judgment required" \
              --force
            gh pr edit "$PR_NUMBER" --add-label human-required
            gh pr comment "$PR_NUMBER" --body \
              "<!-- agent-fix review-attempt=${REVIEW_ATTEMPT} from-sha=${REVIEWED_SHA} result=NO_CHANGES -->
              Automated fixer produced no safe file changes (CLI exit: ${FIXER_EXIT_CODE:-unknown}). Human review is required."
            exit 0
          fi

          protected_re='(^|/)(AGENTS\.md|CLAUDE\.md|\.mcp\.json)$|^\.github/workflows/|^\.claude/|^supabase/migrations/|(^|/)(auth|middleware)(/|\.|$)|(^|/)(rls|polic(y|ies))(/|\.|$)|(^|/)\.env|(^|/)vercel\.json$|^\.agent-'
          if grep -Eiq "$protected_re" <<<"$changed_files"; then
            gh label create human-required \
              --color D93F0B \
              --description "Automated review/fix stopped; human judgment required" \
              --force
            gh pr edit "$PR_NUMBER" --add-label human-required
            gh pr comment "$PR_NUMBER" --body \
              "<!-- agent-fix review-attempt=${REVIEW_ATTEMPT} from-sha=${REVIEWED_SHA} result=PROTECTED_PATH -->
              Automated fixer attempted to change a protected/high-risk path. Nothing was pushed; human review is required."
            exit 0
          fi

          git add -A

          if git diff --cached --quiet; then
            gh label create human-required \
              --color D93F0B \
              --description "Automated review/fix stopped; human judgment required" \
              --force
            gh pr edit "$PR_NUMBER" --add-label human-required
            gh pr comment "$PR_NUMBER" --body \
              "<!-- agent-fix review-attempt=${REVIEW_ATTEMPT} from-sha=${REVIEWED_SHA} result=NO_STAGED_CHANGES -->
              Automated fixer left no committable change. Human review is required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: address automated review findings"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"

          remote_sha="$(git rev-parse HEAD)"
          if [ "$remote_sha" = "$REVIEWED_SHA" ]; then
            echo "Expected a new commit but SHA did not change." >&2
            exit 1
          fi

          gh pr comment "$PR_NUMBER" --body \
            "<!-- agent-fix review-attempt=${REVIEW_ATTEMPT} from-sha=${REVIEWED_SHA} to-sha=${remote_sha} result=FIX_PUSHED -->
            Automated fixer pushed a constrained repair commit. CI has been dispatched; independent review will run again only if CI passes."

          gh workflow run ci.yml --ref "$BRANCH_NAME"

      - name: Remove temporary fixer files
        if: always() && steps.meta.outputs.eligible == 'true'
        shell: bash
        run: |
          rm -f \
            .agent-fix-context.json \
            .agent-source-issue.md \
            /tmp/fixer-prompt.md \
            /tmp/fixer-result.json \
            /tmp/fixer-stderr.log
